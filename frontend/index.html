<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Classification Cascade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">J</div>
        <div class="brand-text">
          <h1>Review Classification Cascade</h1>
          <p>Live Jev classification &middot; TypeSafe AI System One model</p>
        </div>
      </div>
      <div class="topbar-right">
        <label class="demo-toggle" id="demoToggle" for="demoToggleInput" title="Caps the run at 20 reviews, then stops">
          <span class="demo-toggle-label">Demo mode</span>
          <span class="demo-toggle-switch">
            <input type="checkbox" id="demoToggleInput">
            <span class="demo-toggle-track"><span class="demo-toggle-thumb"></span></span>
          </span>
        </label>
        <div class="status" id="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusLabel">Connecting&hellip;</span>
        </div>
      </div>
    </header>

    <!-- Nothing here connects to anything on its own. No SSE connection is
         opened, and no API call is made, until this button is clicked --
         see app.js, which only calls connect() from the click handler.
         This is deliberate: the underlying classification is a paid API
         call, and this page must never spend money just from being
         loaded or reloaded. -->
    <section class="start-bar" id="startBar">
      <div class="start-bar-text">
        <span class="start-bar-icon" id="startIcon">&#9654;</span>
        <div>
          <div class="start-bar-title" id="startTitle">Start classifying</div>
          <div class="start-bar-desc" id="startDesc">Loading run details&hellip;</div>
        </div>
      </div>
      <button class="start-btn" id="startBtn" disabled>Loading&hellip;</button>
    </section>

    <section class="stats">
      <div class="stat-tile stat-hero">
        <div class="stat-value">
          <span id="statCount">0</span><span class="stat-sep">/</span><span id="statTotal">&mdash;</span>
        </div>
        <div class="stat-label">Reviews classified</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="statRate">&mdash;</div>
        <div class="stat-label">Reviews / min</div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="statElapsed">0:00</div>
        <div class="stat-label">Elapsed</div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="statCost">$0.00</div>
        <div class="stat-label">Est. Jev cost</div>
      </div>
    </section>

    <main class="layout">

      <section class="panel feed-panel">
        <div class="panel-head">
          <h2>Live feed</h2>
        </div>
        <div class="feed" id="feed"></div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-head">
          <h2>Label distribution</h2>
        </div>
        <div class="bars" id="bars"></div>
      </section>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
